<div class="filters-card">
    <!-- CLAVE: Nueva cabecera con título y acciones -->
    <div class="filters-header">
        <h3 class="filters-title">Filtros</h3>
        <div class="header-actions">
            <button class="clear-link" *ngIf="isAnyFilterActive()" (click)="clearFilters()">Limpiar</button>
        </div>
    </div>

    <!-- Categorías -->
    <div class="filter-group">
        <div class="accordion-header" (click)="toggleAccordion('categories')">
            <span class="header-label">Categorías</span>
            <svg class="accordion-icon" [class.rotated]="accordionStates['categories']" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="accordion-content" [class.collapsed]="!accordionStates['categories']">
            <div class="checkbox-list">
                <div class="checkbox-item" *ngFor="let category of availableCategories">
                    <input type="checkbox" [id]="'cat-' + category.name" [value]="category.name"
                           [checked]="filterState.categories.includes(category.name)"
                           (change)="onCategoryChange(category.name, $event)">
                    <label [for]="'cat-' + category.name">
                        {{ category.name }} <span class="category-count">({{ category.count }})</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div class="filter-separator"></div>

    <!-- Precio -->
    <div class="filter-group">
        <div class="accordion-header" (click)="toggleAccordion('price')">
            <span class="header-label">Precio</span>
            <svg class="accordion-icon" [class.rotated]="accordionStates['price']" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="accordion-content" [class.collapsed]="!accordionStates['price']">
            <div class="price-inputs">
                <div class="price-input-wrapper">
                    <label for="min-price">Min($)</label>
                    <input type="number" id="min-price" [(ngModel)]="filterState.minPrice" (change)="onMinPriceChange($event)">
                </div>
                <span class="price-separator">-</span>
                <div class="price-input-wrapper">
                    <label for="max-price">Max($)</label>
                    <input type="number" id="max-price" [(ngModel)]="filterState.maxPrice" (change)="onMaxPriceChange($event)">
                </div>
            </div>
        </div>
    </div>

    <div class="filter-separator"></div>

    <!-- Puntuación (Rating) -->
    <div class="filter-group">
        <div class="accordion-header" (click)="toggleAccordion('rating')">
            <span class="header-label">Puntuación</span>
            <svg class="accordion-icon" [class.rotated]="accordionStates['rating']" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="accordion-content" [class.collapsed]="!accordionStates['rating']">
            <div class="star-rating-filter">
                <ng-container *ngFor="let star of [1, 2, 3, 4, 5]; let i = index">
                    <svg class="star-icon-filter"
                         [class.filled]="i + 1 <= selectedRating"
                         (click)="selectRating(i + 1)"
                         width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </ng-container>
            </div>
        </div>
    </div>

    <div class="filter-separator"></div>

    <!-- En Stock -->
    <div class="filter-group">
        <div class="accordion-header" (click)="toggleAccordion('stock')">
            <span class="header-label">En Stock</span>
            <svg class="accordion-icon" [class.rotated]="accordionStates['stock']" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="accordion-content" [class.collapsed]="!accordionStates['stock']">
            <div class="checkbox-item">
                <input type="checkbox" id="in-stock" [(ngModel)]="filterState.inStock" (change)="onInStockChange($event)">
                <label for="in-stock">Disponible</label>
            </div>
        </div>
    </div>

    <div class="filter-separator"></div>

    <!-- En Oferta -->
    <div class="filter-group">
        <div class="accordion-header" (click)="toggleAccordion('sale')">
            <span class="header-label">En Oferta</span>
            <svg class="accordion-icon" [class.rotated]="accordionStates['sale']" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
        <div class="accordion-content" [class.collapsed]="!accordionStates['sale']">
            <div class="checkbox-item">
                <input type="checkbox" id="on-sale" [(ngModel)]="filterState.onSale" (change)="onOnSaleChange($event)">
                <label for="on-sale">Productos en oferta</label>
            </div>
        </div>
    </div>

    <!-- CLAVE: Nueva sección inferior para mostrar filtros aplicados como chips -->
    <div class="applied-filters-footer" *ngIf="isAnyFilterActive()">
        <h4 class="applied-filters-title">Filtros Activos</h4>
        <div class="chips-container">
            <!-- Chip para Categorías -->
            <div class="filter-chip" *ngFor="let category of filterState.categories">
                <span>{{ category }}</span>
                <button (click)="removeCategory(category)">
                    <svg width="12" height="12" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <!-- Chip para Precio -->
            <div class="filter-chip" *ngIf="formattedPriceRange">
                <span>{{ formattedPriceRange }}</span>
                <button (click)="removePriceFilter()">
                    <svg width="12" height="12" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <!-- Chip para Puntuación -->
            <div class="filter-chip" *ngIf="showMinRatingChip">
                <span>{{ filterState.minRating }}+ Estrellas</span>
                <button (click)="removeRatingFilter()">
                    <svg width="12" height="12" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </div>
</div>
