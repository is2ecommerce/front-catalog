<div class="user-header">
    <div class="container header-inner">
        <!-- 1. Logo y Nombre -->
        <a routerLink="/" class="logo" (click)="onLogoClick()">
            <!-- Mantienes tu logo de imagen -->
            <img src="assets/logo.png" alt="eCommerce Logo">
            <span>eCommerce</span>
        </a>

        <!-- 2. Área Central (Búsqueda) - Ahora con estilo de botón separado -->
        <div class="center-area">
            <div class="search-form">
                <input 
                    type="search" 
                    name="query" 
                    placeholder="Buscar productos, marcas y más..." 
                    [(ngModel)]="searchQuery" 
                    (input)="onSearch()"
                    class="search-input"
                >
               
                <button class="search-button" (click)="onSearch()" aria-label="Buscar">
                    <svg width="20" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- 3. Área Derecha (Iconos de Usuario y Carrito) -->
        <div class="right-area">
            <!-- Botón de Usuario -->
            <button class="action-button" aria-label="Perfil">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
            </button>
            <!-- Botón de Carrito -->
            <button class="action-button"  aria-label="Carrito">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c.51 0 .962-.343 1.087-.835l1.823-6.841a.75.75 0 0 0-.543-.922l-13.5-3.51a.75.75 0 0 0-.922.543L3.32 11.25H4.5M7.5 14.25 5.106 5.165" />
                </svg>
            </button>
        </div>
    </div>
</div>
